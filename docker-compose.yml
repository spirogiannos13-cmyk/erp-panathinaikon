services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: panathinaikon-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - panathinaikon_sql_data:/var/opt/mssql
volumes:
  panathinaikon_sql_data:
