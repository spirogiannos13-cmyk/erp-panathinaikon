name: Backend build
on:
  pull_request:
    paths:
      - "backend/**"
      - "app.js"
      - ".github/workflows/backend-build.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "app.js"
      - ".github/workflows/backend-build.yml"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check app.js
      - run: dotnet restore backend/Panathinaikon.Api/Panathinaikon.Api.csproj
      - run: dotnet build backend/Panathinaikon.Api/Panathinaikon.Api.csproj --no-restore --configuration Release
